[package]
name = "inception"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Emit structured boundary events with `inception::tracing::log!`.
tracing = ["dep:tracing"]
serde = ["dep:serde"]

[dependencies]
inception-derive = { path = "../inception-derive" }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
trybuild = "1"
